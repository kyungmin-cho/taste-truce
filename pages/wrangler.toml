# Cloudflare Pages project for Taste Truce. Static files come from dist/ (npm run build);
# functions/ serves /api/*, /scene/*, /health and the session cookie on / and /classic.
# The KV and D1 ids below are placeholders for local runs; the deploy runbook replaces them.
name = "taste-truce"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[vars]
DEFAULT_SCENE = "majority"
# The Qloo key is shared with another server that keeps 1,000 calls a month for use elsewhere.
# This installation may make MONTHLY_CALL_CAP - MONTHLY_RESERVED_CALLS = 500 calls a month (UTC),
# read on every call, so a new value applies at once. See the deploy runbook before changing it.
MONTHLY_CALL_CAP = "8000"
MONTHLY_RESERVED_CALLS = "7500"

# Qloo response cache and saved scenes, filled by seed_kv.py. Never committed.
[[kv_namespaces]]
binding = "CACHE"
id = "6c8d29021a254f0985922f06dc59d849"

# Session and call-budget counters.
[[d1_databases]]
binding = "DB"
database_name = "taste-truce"
database_id = "1d6cc6d8-be97-437e-965a-6edf141ce35f"
